services:
  - type: web
    name: ggeomnyang-trainer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # 코디세이 Anthropic 호환 API (키 또는 토큰 중 하나만)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        value: https://copa.codyssey.kr
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4
      - key: ANTHROPIC_FALLBACK_MODELS
        value: claude-haiku-4
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: FIRESTORE_DATABASE_ID
        value: default
      - key: CORS_ORIGINS
        sync: false
      - key: STRESS_THRESHOLD
        value: "7"
